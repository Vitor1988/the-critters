<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>the critters — rigged</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@500;900&display=swap');
html,body{margin:0;padding:0;background:#f2f2f2;overscroll-behavior:none;overflow:hidden}
#render{position:absolute;top:0;left:0}
.content{position:relative;margin-top:20px;margin-left:20px;text-align:left;color:#000;z-index:999;pointer-events:none}
.header{letter-spacing:0;font-size:24px;font-family:'Source Code Pro',monospace;font-weight:600}
.header h1{margin:0;font-size:24px}
.description{font-size:14px;font-family:'Source Code Pro',monospace;margin-top:12px;width:520px;line-height:1.5}
.navigation{margin-top:16px;pointer-events:auto}
button{border:0;background:#000;color:#fff;padding:14px 18px;margin-right:8px;font-size:14px;font-family:'Source Code Pro',monospace;cursor:pointer}
button:hover{opacity:.75}
#cam{position:fixed;right:16px;bottom:16px;width:180px;border-radius:8px;transform:scaleX(-1);opacity:.85;z-index:1000}
</style>
</head>
<body>
<canvas id="render"></canvas>
<video id="cam" autoplay muted playsinline></video>
<div class="content">
  <div class="header"><h1 id="txt-title">the critters — rigged</h1></div>
  <div class="description" id="txt-description">loading face tracker…</div>
  <div class="navigation">
    <button id="btn-random">random</button>
    <button id="btn-recal">recalibrate</button>
    <button id="btn-save">save png</button>
    <button id="btn-back">generative</button>
  </div>
</div>
<script src="engine.js"></script>
<script type="module">
import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const canvas = document.getElementById('render');
const ctx = canvas.getContext('2d');
const video = document.getElementById('cam');
const titleEl = document.getElementById('txt-title');
const descEl = document.getElementById('txt-description');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 0, H = 0;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

let model = null, pal = null, currentId = '';
let eyeBinds = [];
let openMouthShapes = [];
let browRigs = [];

function luminance(hex) {
  const r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16);
  return (299 * r + 587 * g + 114 * b) / 1000;
}

function centroid(pts) {
  let x = 0, y = 0;
  for (const p of pts) { x += p[0]; y += p[1]; }
  return [x / pts.length, y / pts.length];
}

function loadCritter(id) {
  currentId = id;
  model = buildModel(id, { rig: true });
  for (const sh of model.shapes) sh.intensity = Math.max(5, sh.intensity);
  pal = model.palette;
  document.body.style.background = pal.bg;
  window.location.hash = id;

  eyeBinds = [];
  for (const sh of model.shapes) {
    if (sh.role !== 'eye') continue;
    const c = centroid(sh.pts);
    let best = 0, bestD = 1e9;
    model.eyes.forEach((e, i) => {
      const d = Math.hypot(c[0] - e[0], c[1] - e[1]);
      if (d < bestD) { bestD = d; best = i; }
    });
    const side = model.eyes.length === 1 ? 'B' : (best < model.eyes.length / 2 ? 'L' : 'R');
    sh.cy = model.eyes[best][1];
    eyeBinds.push({ sh, side });
  }

  browRigs = [];
  const browEyes = model.eyes.slice(0, 2);
  if (browEyes.length === 2) {
    const rng3 = mulberry32(hashStr(currentId + ':brow'));
    for (let bi = 0; bi < 2; bi++) {
      const [ex, ey, er] = browEyes[bi];
      const inner = bi === 0 ? 1 : -1;
      const pts = wobblyArc(ex, ey - er * 1.75, er * 1.05, er * 0.5, Math.PI * 1.08, Math.PI * 1.92, 8, 3, rng3);
      const sh = { pts, offs: pts.map(() => [0, 0]), closed: false, lw: 4, alpha: 1, intensity: 8, fill: null, stroke: pal.line, role: 'browRig', oy: 0, drop: 0, dropW: pts.map((p, pi) => (p[0] - ex) / (er * 1.05) * inner) };
      model.shapes.push(sh);
      browRigs.push({ sh, dir: 1 });
    }
  }

  const m = model.mouth;
  model.dropCap = Math.max(14, model.botY * 1.02 - m.y - 4);
  openMouthShapes = [];
  let holeCy = m.y;
  for (const sh of model.shapes.filter(s => s.role === 'mouth' && s.closed && s.fill === pal.line)) {
    holeCy = centroid(sh.pts)[1];
    break;
  }
  for (const sh of model.shapes.filter(s => s.role === 'mouth')) {
    const c = centroid(sh.pts);
    if (!sh.closed) {
      const rig = {
        pts: sh.pts.concat(sh.pts.slice().reverse()),
        offs: sh.pts.concat(sh.pts).map(() => [0, 0]),
        closed: true, lw: sh.lw, alpha: 1, intensity: sh.intensity,
        fill: pal.line, stroke: pal.line, role: 'mouthRig',
        drop: 0, dropW: sh.pts.map(() => 0).concat(sh.pts.map(() => 1)),
        cx: c[0], cy: c[1], sx: 1, sy: 1, alphaMul: 1
      };
      model.shapes.splice(model.shapes.indexOf(sh), 0, rig);
      sh.alphaMul = 0;
      openMouthShapes.push(rig);
    } else if (sh.fill === pal.mouth) {
      sh.alphaMul = 0;
    } else if (sh.fill === pal.line || m.style === 'open' || m.style === 'grin' || m.style === 'o') {
      sh.cx = c[0]; sh.cy = holeCy;
      sh.holeRig = true;
      openMouthShapes.push(sh);
    } else if (sh.fill === pal.teeth) {
      sh.teethRig = true;
      sh.cx = 0;
    }
  }

  titleEl.textContent = 'the critter @' + id + ' — rigged';
  const fg = luminance(pal.bg) >= 128 ? '#000' : '#fff';
  titleEl.style.color = fg; descEl.style.color = fg;
}

const sig = { blinkL: 1, blinkR: 1, mouth: 0, mouthW: 0, expr: 0, yaw: 0, pitch: 0, roll: 0, gx: 0, gy: 0, hx: 0, hy: 0, joy: 0, sad: 0, surprise: 0, anger: 0, wide: 0 };
let calib = null, calibFrames = 0, calibAcc = { ear: 0, mouth: 0, yaw: 0, pitch: 0, roll: 0, hx: 0, hy: 0, mouthW: 0 };
let tracking = false;
const mouse = { x: 0, y: 0, down: false };
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mousedown', () => mouse.down = true);
window.addEventListener('mouseup', () => mouse.down = false);
window.addEventListener('keydown', e => { if (e.keyCode === 76) loadCritter(randomId()); else if (e.keyCode === 83) savePng(); });

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function processLandmarks(lm, bs) {
  const earL = dist(lm[159], lm[145]) / dist(lm[33], lm[133]);
  const earR = dist(lm[386], lm[374]) / dist(lm[362], lm[263]);
  const faceH = dist(lm[10], lm[152]);
  const mouthR = dist(lm[13], lm[14]) / faceH;
  const mouthW = dist(lm[61], lm[291]) / faceH;

  const rollRaw = Math.atan2(lm[263].y - lm[33].y, lm[263].x - lm[33].x);
  const midX = (lm[234].x + lm[454].x) / 2;
  const halfW = Math.abs(lm[454].x - lm[234].x) / 2 + 1e-6;
  const yawRaw = clamp(-(lm[1].x - midX) / halfW, -1.2, 1.2);
  const pitchRaw = ((lm[10].y + lm[152].y) / 2 - lm[1].y) / (lm[152].y - lm[10].y);
  const hxRaw = (0.5 - lm[1].x) * 2;
  const hyRaw = (lm[1].y - 0.5) * 2;

  if (!calib) {
    calibFrames++;
    calibAcc.ear += (earL + earR) / 2;
    calibAcc.mouth += mouthR;
    calibAcc.yaw += yawRaw; calibAcc.pitch += pitchRaw; calibAcc.roll += rollRaw;
    calibAcc.hx += hxRaw; calibAcc.hy += hyRaw; calibAcc.mouthW += mouthW;
    if (calibFrames >= 50) {
      const n = calibFrames;
      calib = {
        ear: calibAcc.ear / n, mouth: calibAcc.mouth / n, mouthW: calibAcc.mouthW / n,
        yaw: calibAcc.yaw / n, pitch: calibAcc.pitch / n, roll: calibAcc.roll / n,
        hx: calibAcc.hx / n, hy: calibAcc.hy / n
      };
      setStatus('tracking — express yourself');
    }
    return;
  }

  if (bs) {
    const jaw = clamp((bs.jawOpen - 0.03) * 1.05, 0, 1);
    sig.mouth += (jaw - sig.mouth) * (jaw > sig.mouth ? 0.45 : 0.28);
    const smile = (bs.mouthSmileLeft + bs.mouthSmileRight) / 2;
    const frown = (bs.mouthFrownLeft + bs.mouthFrownRight) / 2;
    sig.expr += (clamp(smile - frown, -1, 1) - sig.expr) * 0.25;
    const smileB = clamp(smile * 1.8, 0, 1);
    const frownB = clamp(frown * 1.8, 0, 1);
    const squint = (bs.eyeSquintLeft + bs.eyeSquintRight) / 2;
    sig.joy += (clamp(smileB * 0.7 + squint * 0.8, 0, 1) - sig.joy) * 0.3;
    sig.sad += (clamp(frownB * 0.6 + bs.browInnerUp * frownB * 0.8, 0, 1) - sig.sad) * 0.3;
    const wide = (bs.eyeWideLeft + bs.eyeWideRight) / 2;
    const browUp = (bs.browInnerUp + (bs.browOuterUpLeft + bs.browOuterUpRight) / 2) / 2;
    sig.surprise += (clamp(wide * 0.9 + browUp * 0.9, 0, 1) - sig.surprise) * 0.3;
    sig.anger += (clamp((bs.browDownLeft + bs.browDownRight) * 0.9, 0, 1) - sig.anger) * 0.3;
    sig.wide += (clamp(wide * 1.5, 0, 1) - sig.wide) * 0.3;
    const pucker = (bs.mouthPucker + bs.mouthFunnel) / 2;
    const stretch = (bs.mouthStretchLeft + bs.mouthStretchRight) / 2;
    sig.mouthW += (clamp((stretch - pucker) * 0.8, -0.5, 0.5) - sig.mouthW) * 0.3;
    sig.blinkL += (clamp(1 - bs.eyeBlinkRight * 1.15, 0.03, 1) - sig.blinkL) * 0.5;
    sig.blinkR += (clamp(1 - bs.eyeBlinkLeft * 1.15, 0.03, 1) - sig.blinkR) * 0.5;
    const bgx = clamp((bs.eyeLookOutLeft + bs.eyeLookInRight - bs.eyeLookInLeft - bs.eyeLookOutRight) * 1.3, -1, 1);
    const bgy = clamp((bs.eyeLookDownLeft + bs.eyeLookDownRight - bs.eyeLookUpLeft - bs.eyeLookUpRight) * 1.1, -1, 1);
    sig.gx += (bgx - sig.gx) * 0.35;
    sig.gy += (bgy - sig.gy) * 0.35;
  } else {
    const tBlinkL = clamp((earL - calib.ear * 0.45) / (calib.ear * 0.45), 0.05, 1);
    const tBlinkR = clamp((earR - calib.ear * 0.45) / (calib.ear * 0.45), 0.05, 1);
    sig.blinkL += (tBlinkL - sig.blinkL) * 0.45;
    sig.blinkR += (tBlinkR - sig.blinkR) * 0.45;
    const openT = clamp(Math.pow(clamp((mouthR - calib.mouth * 1.1) / 0.05, 0, 1), 0.8), 0, 1);
    sig.mouth += (openT - sig.mouth) * (openT > sig.mouth ? 0.6 : 0.25);
    const wT = clamp((mouthW - calib.mouthW) / calib.mouthW, -0.25, 0.4);
    sig.mouthW += (wT - sig.mouthW) * 0.3;
    const cornerY = (lm[61].y + lm[291].y) / 2;
    const exprT = clamp(-(cornerY - lm[17].y) / faceH * 9, -1, 1);
    sig.expr += (exprT - sig.expr) * 0.3;
    const eyeW = dist(lm[33], lm[133]);
    const gx = -((lm[468].x - (lm[33].x + lm[133].x) / 2) / eyeW) * 2.4;
    const gy = ((lm[468].y - (lm[159].y + lm[145].y) / 2) / (dist(lm[159], lm[145]) + 0.001)) * 0.8;
    sig.gx += (clamp(gx, -1, 1) - sig.gx) * 0.3;
    sig.gy += (clamp(gy, -1, 1) - sig.gy) * 0.3;
  }

  sig.roll += (-(rollRaw - calib.roll) * 2 - sig.roll) * 0.2;
  sig.yaw += (clamp((yawRaw - calib.yaw) * 2.2, -1.2, 1.2) - sig.yaw) * 0.2;
  sig.pitch += ((pitchRaw - calib.pitch) * 6 - sig.pitch) * 0.2;

  sig.hx += ((hxRaw - calib.hx) * 2 - sig.hx) * 0.15;
  sig.hy += ((hyRaw - calib.hy) * 2 - sig.hy) * 0.15;
}

let landmarker = null;
async function startTracking() {
  try {
    const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    landmarker = await FaceLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numFaces: 1,
      outputFaceBlendshapes: true
    });
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    video.srcObject = stream;
    await video.play();
    tracking = true;
    setStatus('calibrating — look neutral at the camera…');
  } catch (err) {
    tracking = false;
    video.style.display = 'none';
    setStatus('no camera / tracker — mouse mode (move = gaze, hold click = open mouth)');
  }
}

function setStatus(t) {
  descEl.textContent = model.traits.join(' · ') + ' — ' + t;
}

let blinkTimer = 0;
function frame(now) {
  requestAnimationFrame(frame);

  if (tracking && landmarker && video.readyState >= 2) {
    const res = landmarker.detectForVideo(video, now);
    if (res.faceLandmarks && res.faceLandmarks[0]) {
      let bs = null;
      if (res.faceBlendshapes && res.faceBlendshapes[0]) {
        bs = {};
        for (const c of res.faceBlendshapes[0].categories) bs[c.categoryName] = c.score;
      }
      processLandmarks(res.faceLandmarks[0], bs);
    }
  } else if (!tracking) {
    const mmx = (mouse.x - W / 2) / (W / 2), mmy = (mouse.y - H / 2) / (H / 2);
    sig.gx += (clamp(mmx, -1, 1) - sig.gx) * 0.1;
    sig.gy += (clamp(mmy, -1, 1) - sig.gy) * 0.1;
    sig.yaw += (mmx * 0.4 - sig.yaw) * 0.08;
    sig.pitch += (mmy * 0.3 - sig.pitch) * 0.08;
    sig.mouth += ((mouse.down ? 0.4 + Math.random() * 0.6 : 0) - sig.mouth) * 0.3;
    sig.expr += (clamp(-mmy * 1.2, -1, 1) - sig.expr) * 0.1;
    blinkTimer -= 1;
    if (blinkTimer <= 0) blinkTimer = 120 + Math.random() * 200;
    const tb = blinkTimer < 8 ? 0.05 : 1;
    sig.blinkL += (tb - sig.blinkL) * 0.5;
    sig.blinkR += (tb - sig.blinkR) * 0.5;
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = pal.bg;
  ctx.fillRect(0, 0, W, H);

  const S = Math.min(W, H) / 470;
  ctx.save();
  ctx.translate(W / 2 + sig.hx * 16 * S, H / 2 + (12 + sig.hy * 22 - sig.pitch * 12) * S);
  ctx.rotate(sig.roll * 0.5);
  ctx.scale(S, S);

  if (model) {
    for (const b of eyeBinds) {
      const bl = b.side === 'L' ? sig.blinkL : b.side === 'R' ? sig.blinkR : (sig.blinkL + sig.blinkR) / 2;
      b.sh.sy = clamp(bl * (1 - sig.joy * 0.3) + sig.wide * 0.25, 0.03, 1.3);
      if (b.sh.follow) b.sh.follow.blinkScale = bl;
    }
    for (const br of browRigs) {
      br.sh.oy = -sig.surprise * 14 + sig.anger * 7 - sig.joy * 2;
      br.sh.drop = (sig.anger - sig.sad) * 10 * br.dir;
    }
    for (const sh of model.shapes) {
      if (sh.role === 'mouthRig') {
        sh.drop = sig.mouth * model.dropCap;
        sh.sx = 1 + sig.mouthW * 0.4;
      } else if (sh.teethRig) {
        sh.sx = 1 + sig.mouthW * 0.4;
      } else if (sh.holeRig) {
        sh.sy = 0.12 + 1.05 * sig.mouth;
        sh.sx = 1 + sig.mouthW * 0.4;
      }
    }
    const env = { drx: sig.yaw * 0.5, dry: -sig.pitch * 0.6, angle: Math.atan2(sig.yaw, -sig.pitch + 0.001), Ui: 2 + sig.mouth * 18, frozen: false };
    for (const sh of model.shapes) {
      if (sh.follow) {
        const f = sh.follow;
        const bsc = f.blinkScale === undefined ? 1 : f.blinkScale;
        f.tx = sig.gx * f.max * 1.3 * bsc;
        f.ty = sig.gy * f.max * 1.3 * bsc;
        f.dx = (f.dx || 0) + (f.tx - (f.dx || 0)) * 0.2;
        f.dy = (f.dy || 0) + (f.ty - (f.dy || 0)) * 0.2;
      }
      drawPath(ctx, sh, env);
    }
  }
  ctx.restore();
}

function savePng() {
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'critter-rigged-' + currentId + '.png';
    a.click();
    URL.revokeObjectURL(a.href);
  });
}

document.getElementById('btn-random').addEventListener('click', () => loadCritter(randomId()));
document.getElementById('btn-save').addEventListener('click', savePng);
document.getElementById('btn-recal').addEventListener('click', () => {
  calib = null; calibFrames = 0; calibAcc = { ear: 0, mouth: 0, yaw: 0, pitch: 0, roll: 0, hx: 0, hy: 0 };
  if (tracking) setStatus('calibrating — look neutral at the camera…');
});
document.getElementById('btn-back').addEventListener('click', () => { window.location.href = 'index.html' + window.location.hash; });

const h = window.location.hash.slice(1);
loadCritter(/^[0-9a-z]{6,10}$/.test(h) ? h : randomId());
requestAnimationFrame(frame);
startTracking();
</script>
</body>
</html>
