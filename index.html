<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>the critters</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@500;900&display=swap');
html,body{margin:0;padding:0;background:#f2f2f2;overscroll-behavior:none;overflow:hidden}
#render{position:absolute;top:0;left:0}
.content{position:relative;margin-top:20px;margin-left:20px;text-align:left;color:#000;z-index:999;pointer-events:none}
.header{letter-spacing:0;font-size:24px;font-family:'Source Code Pro',monospace;font-weight:600}
.header h1{margin:0;font-size:24px}
.description{font-size:14px;font-family:'Source Code Pro',monospace;margin-top:12px;width:520px;line-height:1.5}
.navigation{margin-top:16px;pointer-events:auto}
button{border:0;background:#000;color:#fff;padding:14px 18px;margin-right:8px;font-size:14px;font-family:'Source Code Pro',monospace;cursor:pointer}
button:hover{opacity:.75}
</style>
</head>
<body>
<canvas id="render"></canvas>
<div class="content">
  <div class="header"><h1 id="txt-title">the critters</h1></div>
  <div class="description" id="txt-description"></div>
  <div class="navigation">
    <button id="btn-random">random</button>
    <button id="btn-save">save png</button>
    <button id="btn-rig">rigged cam</button>
  </div>
</div>
<script src="engine.js"></script>
<script>
'use strict';
const canvas = document.getElementById('render');
const ctx = canvas.getContext('2d');
const titleEl = document.getElementById('txt-title');
const descEl = document.getElementById('txt-description');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 0, H = 0;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

let model = null;
let currentId = '';
let pal = null;

const mouse = { x: 0, y: 0 };
let Ui = 2, staticMode = false, frozen = false;
let drx = 0, dry = 0, angle = 0;

window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('touchmove', e => { const t = e.changedTouches[0]; mouse.x = t.pageX; mouse.y = t.pageY; }, { passive: true });
canvas.addEventListener('mousedown', () => { Ui += Ui < 50 ? 100 : 1 + 1.001 * Ui; });
canvas.addEventListener('touchstart', () => { Ui += 1 + 1.001 * Ui; }, { passive: true });

window.addEventListener('keydown', e => {
  if (e.keyCode === 76) loadCritter(randomId());
  else if (e.keyCode === 32) { staticMode = !staticMode; if (staticMode) frozen = false; }
  else if (e.keyCode === 65) { frozen = !frozen; if (frozen) staticMode = false; }
  else if (e.keyCode === 83) savePng();
});

let smx = 0, smy = 0;
function frame() {
  requestAnimationFrame(frame);

  if (staticMode || frozen) Ui = 0;
  else {
    Ui += 0.05 * (0 - Ui);
    Ui = Math.min(Ui, 1500);
    if (Ui < 5) Ui = 2;
  }

  const tDrx = staticMode ? 0 : (mouse.x - W / 2) / W * 0.5;
  const tDry = staticMode ? 0 : (mouse.y - H / 2) / H * 0.5;
  drx += (tDrx - drx) * 0.15;
  dry += (tDry - dry) * 0.15;
  angle = Math.atan2(mouse.x - W / 2, mouse.y - H / 2);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = pal.bg;
  ctx.fillRect(0, 0, W, H);

  const S = Math.min(W, H) / 470;
  const mmx = (mouse.x - W / 2) / S, mmy = (mouse.y - H / 2) / S;
  smx += (mmx - smx) * 0.07;
  smy += (mmy - smy) * 0.07;
  const swayX = frozen || staticMode ? 0 : smx * 0.03, swayY = frozen || staticMode ? 0 : smy * 0.03;
  const swayR = frozen || staticMode ? 0 : smx * 0.0004;

  ctx.save();
  ctx.translate(W / 2 + swayX * S, H / 2 + swayY * S + 12 * S);
  ctx.rotate(swayR);
  ctx.scale(S, S);

  if (model) {
    const env = { drx, dry, angle, Ui, frozen };
    for (const sh of model.shapes) {
      if (sh.follow) {
        const f = sh.follow;
        if (!frozen && !staticMode) {
          const a = Math.atan2(smy - f.y, smx - f.x);
          const d = Math.min(Math.hypot(smx - f.x, smy - f.y) * 0.35, f.max);
          f.tx = Math.cos(a) * d; f.ty = Math.sin(a) * d;
        } else if (staticMode) { f.tx = 0; f.ty = 0; }
        f.dx = (f.dx || 0) + ((f.tx || 0) - (f.dx || 0)) * 0.15;
        f.dy = (f.dy || 0) + ((f.ty || 0) - (f.dy || 0)) * 0.15;
      }
      drawPath(ctx, sh, env);
    }
  }
  ctx.restore();
}
requestAnimationFrame(frame);

function luminance(hex) {
  const r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16);
  return (299 * r + 587 * g + 114 * b) / 1000;
}

function loadCritter(id) {
  currentId = id;
  model = buildModel(id);
  pal = model.palette;
  document.body.style.background = pal.bg;
  titleEl.textContent = 'the critter @' + id;
  descEl.textContent = model.traits.join(' · ') + ' — L random · space static · A freeze · S save';
  const fg = luminance(pal.bg) >= 128 ? '#000' : '#fff';
  titleEl.style.color = fg; descEl.style.color = fg;
  window.location.hash = id;
}

function savePng() {
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'critter-' + currentId + '.png';
    a.click();
    URL.revokeObjectURL(a.href);
  });
}

document.getElementById('btn-random').addEventListener('click', () => loadCritter(randomId()));
document.getElementById('btn-save').addEventListener('click', savePng);
document.getElementById('btn-rig').addEventListener('click', () => { window.location.href = 'rigged.html' + window.location.hash; });

(function init() {
  const h = window.location.hash.slice(1);
  loadCritter(/^[0-9a-z]{6,10}$/.test(h) ? h : randomId());
})();
</script>
</body>
</html>
