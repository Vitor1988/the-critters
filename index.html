<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>the critters</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@500;900&display=swap');
html,body{margin:0;padding:0;background:#f2f2f2;overscroll-behavior:none;overflow:hidden}
#render{position:absolute;top:0;left:0}
.content{position:relative;margin-top:20px;margin-left:20px;text-align:left;color:#000;z-index:999;pointer-events:none}
.header{letter-spacing:0;font-size:24px;font-family:'Source Code Pro',monospace;font-weight:600}
.header h1{margin:0;font-size:24px}
.description{font-size:14px;font-family:'Source Code Pro',monospace;margin-top:12px;width:520px;line-height:1.5}
.navigation{margin-top:16px;pointer-events:auto}
button{border:0;background:#000;color:#fff;padding:14px 18px;margin-right:8px;font-size:14px;font-family:'Source Code Pro',monospace;cursor:pointer}
button:hover{opacity:.75}
</style>
</head>
<body>
<canvas id="render"></canvas>
<div class="content">
  <div class="header"><h1 id="txt-title">the critters</h1></div>
  <div class="description" id="txt-description"></div>
  <div class="navigation">
    <button id="btn-random">random</button>
    <button id="btn-save">save png</button>
  </div>
</div>
<script>
'use strict';
const canvas = document.getElementById('render');
const ctx = canvas.getContext('2d');
const titleEl = document.getElementById('txt-title');
const descEl = document.getElementById('txt-description');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 0, H = 0;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 16777619) >>> 0; }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const B36 = '0123456789abcdefghijklmnopqrstuvwxyz';

const PALETTES = [
  { name: 'paper',  bg: '#fdfcf8', face: ['#fdfcf8'], line: '#16130f', ear: '#fdfcf8', eye: '#fdfcf8', pupil: '#16130f', nose: '#fdfcf8', horn: '#fdfcf8', mouth: '#e8b4b8', teeth: '#fdfcf8' },
  { name: 'melon',  bg: '#fff3e4', face: ['#ffd9c0', '#ffe9d6', '#ffcdb2'], line: '#59362b', ear: '#e88ca0', eye: '#fff8ec', pupil: '#59362b', nose: '#e88ca0', horn: '#7fb069', mouth: '#d1603d', teeth: '#fff8ec' },
  { name: 'lagoon', bg: '#d8f3ee', face: ['#a7e8e0', '#c8f1ec'], line: '#14424c', ear: '#f4a259', eye: '#fdfdf4', pupil: '#14424c', nose: '#f4a259', horn: '#ee6c4d', mouth: '#ee6c4d', teeth: '#fdfdf4' },
  { name: 'grape',  bg: '#efe7fb', face: ['#d9c8f5', '#e4d8f9'], line: '#3d2c5a', ear: '#8f6fc9', eye: '#fdfaff', pupil: '#3d2c5a', nose: '#8f6fc9', horn: '#ffd23f', mouth: '#c95d8e', teeth: '#fdfaff' },
  { name: 'moss',   bg: '#eef2e2', face: ['#cfe0b5', '#ddeac9'], line: '#2e3b24', ear: '#8a9b6e', eye: '#fbfdf4', pupil: '#2e3b24', nose: '#8a9b6e', horn: '#e07a5f', mouth: '#b5654d', teeth: '#fbfdf4' },
  { name: 'ember',  bg: '#2b2d42', face: ['#ef8354', '#f4a261'], line: '#1a1b2e', ear: '#e63946', eye: '#fff3e4', pupil: '#1a1b2e', nose: '#e63946', horn: '#ffd23f', mouth: '#ffd23f', teeth: '#fff3e4' },
  { name: 'candy',  bg: '#ffe5f1', face: ['#ffc4dd', '#ffd6e8'], line: '#7a1f4d', ear: '#ff8fb8', eye: '#fff6fa', pupil: '#7a1f4d', nose: '#ff8fb8', horn: '#5ec8e5', mouth: '#d94f70', teeth: '#fff6fa' },
  { name: 'denim',  bg: '#e3ecf5', face: ['#b8cfe8', '#cbddf0'], line: '#1d3557', ear: '#5c7ea3', eye: '#f5f9fd', pupil: '#1d3557', nose: '#5c7ea3', horn: '#e9c46a', mouth: '#c1666b', teeth: '#f5f9fd' },
  { name: 'slime',  bg: '#f2ffd8', face: ['#c6ec7d', '#d9f49b'], line: '#2f4419', ear: '#7ba23f', eye: '#fafff0', pupil: '#2f4419', nose: '#7ba23f', horn: '#9b5de5', mouth: '#e07a9a', teeth: '#fafff0' },
  { name: 'noir',   bg: '#131417', face: ['#23262b', '#2e3238'], line: '#e8e6df', ear: '#4a4f57', eye: '#e8e6df', pupil: '#131417', nose: '#4a4f57', horn: '#ffd23f', mouth: '#c1666b', teeth: '#e8e6df' }
];

const SPECIES = [
  { name: 'cat',    rx: 95,  ry: 88, ear: 'tri',   nose: 'tri' },
  { name: 'dog',    rx: 105, ry: 85, ear: 'flop',  nose: 'round' },
  { name: 'rabbit', rx: 80,  ry: 92, ear: 'long',  nose: 'tri' },
  { name: 'bear',   rx: 100, ry: 92, ear: 'round', nose: 'round' },
  { name: 'frog',   rx: 112, ry: 68, ear: 'none',  nose: 'dots' },
  { name: 'owl',    rx: 92,  ry: 90, ear: 'tuft',  nose: 'none', beak: 18 },
  { name: 'mouse',  rx: 85,  ry: 85, ear: 'big',   nose: 'tri' },
  { name: 'fox',    rx: 95,  ry: 85, ear: 'tri',   nose: 'snout' },
  { name: 'panda',  rx: 98,  ry: 90, ear: 'round', nose: 'round', patches: true },
  { name: 'pig',    rx: 100, ry: 88, ear: 'flop',  nose: 'pig' }
];

const HEAD_SHAPES = ['round', 'tall', 'wide', 'pear', 'skull', 'boxy', 'lumpy', 'bean', 'peanut', 'cone', 'dome', 'blob', 'bulb', 'moon', 'trapezoid'];
const EYE_STYLES = ['dot', 'ball', 'dead', 'chameleon', 'lazy', 'star', 'closed', 'wink', 'googly', 'ring'];
const MOUTH_STYLES = ['smile', 'chill', 'mad', 'open', 'fangs', 'tongue', 'w', 'zigzag', 'o', 'grin', 'smirk'];
const TOP_STYLES = ['none', 'horns', 'antenna', 'mohawk', 'halo'];
const PATTERNS = ['none', 'stripes', 'spots', 'mask', 'patch'];
const ACCESSORIES = ['none', 'blush', 'brows', 'whiskers', 'scar', 'eyepatch', 'piercing', 'nosering', 'hat', 'beanie'];

const W_PALETTE = [14, 10, 10, 10, 10, 9, 10, 10, 9, 8];
const W_HEAD    = [18, 11, 11, 8, 6, 8, 6, 6, 5, 5, 5, 3, 3, 2, 3];
const W_EYEC    = [8, 55, 17, 12, 8];
const W_EYES    = [20, 16, 4, 6, 10, 6, 12, 8, 10, 8];
const W_MOUTH   = [16, 10, 8, 9, 7, 8, 8, 6, 5, 10, 13];
const W_TOP     = [55, 14, 11, 10, 10];
const W_PATTERN = [55, 11, 11, 11, 12];
const W_ACC     = [26, 13, 11, 11, 7, 7, 7, 7, 6, 5];

function pickW(v, weights) {
  let total = 0;
  for (const w of weights) total += w;
  let x = v / 36 * total;
  for (let i = 0; i < weights.length; i++) { x -= weights[i]; if (x < 0) return i; }
  return weights.length - 1;
}

function rotatePt(x, y, cx, cy, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [cx + (x - cx) * c - (y - cy) * s, cy + (x - cx) * s + (y - cy) * c];
}

function wobblyArc(cx, cy, rx, ry, a0, a1, seg, jit, rng, rot) {
  const pts = [];
  for (let i = 0; i <= seg; i++) {
    const a = a0 + (a1 - a0) * i / seg;
    let x = cx + Math.cos(a) * rx + (rng() - .5) * jit;
    let y = cy + Math.sin(a) * ry + (rng() - .5) * jit;
    if (rot) { const p = rotatePt(x, y, cx, cy, rot); x = p[0]; y = p[1]; }
    pts.push([x, y]);
  }
  return pts;
}

function wobblyCircle(cx, cy, rx, ry, seg, jit, rng, rot) {
  return wobblyArc(cx, cy, rx, ry, 0, Math.PI * 2, seg, jit, rng, rot);
}

function wobblyPoly(verts, sub, jit, rng) {
  const pts = [];
  for (let i = 0; i < verts.length; i++) {
    const a = verts[i], b = verts[(i + 1) % verts.length];
    for (let j = 0; j < sub; j++) {
      const t = j / sub;
      pts.push([a[0] + (b[0] - a[0]) * t + (rng() - .5) * jit, a[1] + (b[1] - a[1]) * t + (rng() - .5) * jit]);
    }
  }
  return pts;
}

function starVerts(cx, cy, ro, ri, n, rot) {
  const v = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 === 0 ? ro : ri;
    const a = rot + Math.PI * i / n;
    v.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  return v;
}

function headPoints(shape, rx, ry, jit, rng) {
  if (shape === 'boxy') {
    const pts = [], n = 3;
    for (let i = 0; i <= 16; i++) {
      const a = Math.PI * 2 * i / 16;
      const c = Math.cos(a), s = Math.sin(a);
      pts.push([Math.sign(c) * Math.pow(Math.abs(c), 2 / n) * rx + (rng() - .5) * jit,
                Math.sign(s) * Math.pow(Math.abs(s), 2 / n) * ry + (rng() - .5) * jit]);
    }
    return pts;
  }
  let erx = rx, ery = ry, j = jit;
  if (shape === 'tall') { erx *= 0.85; ery *= 1.22; }
  else if (shape === 'wide') { erx *= 1.22; ery *= 0.85; }
  else if (shape === 'lumpy') j = jit * 2.6;
  let pts = wobblyCircle(0, 0, erx, ery, 16, j, rng);
  const uy = ry;
  if (shape === 'pear' || shape === 'skull') {
    const k = shape === 'pear' ? 1 : -1;
    pts = pts.map(([x, y]) => [x * (1 + k * 0.3 * (y / uy)), y]);
  } else if (shape === 'bean') {
    pts = pts.map(([x, y]) => [x + Math.sin(y / uy * Math.PI * 0.5) * rx * 0.18, y]);
  } else if (shape === 'peanut') {
    pts = pts.map(([x, y]) => [x * (0.55 + 0.45 * Math.abs(Math.cos(y / uy * Math.PI * 0.5))) * 1.15, y]);
  } else if (shape === 'cone') {
    pts = pts.map(([x, y]) => [x * (0.35 + 0.9 * (y / uy + 1) / 2), y]);
  } else if (shape === 'trapezoid') {
    pts = pts.map(([x, y]) => [x * (1.25 - 0.55 * (y / uy + 1) / 2), y]);
  } else if (shape === 'dome') {
    pts = pts.map(([x, y]) => [x, y > uy * 0.55 ? uy * 0.55 + (y - uy * 0.55) * 0.3 : y * 1.12]);
  } else if (shape === 'blob') {
    pts = pts.map(([x, y]) => y > 0 ? [x * 1.12, y * 1.32] : [x * 0.82, y]);
  } else if (shape === 'bulb') {
    pts = pts.map(([x, y]) => y < 0 ? [x * 1.05, y * 1.15] : [x * 0.55, y]);
  } else if (shape === 'moon') {
    pts = pts.map(([x, y]) => [x + Math.sin(y / uy * Math.PI * 0.5) * rx * 0.38, y]);
  }
  return pts;
}

function widthAt(pts, y, tol) {
  let m = 0;
  for (const p of pts) if (Math.abs(p[1] - y) < tol) m = Math.max(m, Math.abs(p[0]));
  return m;
}

function parseId(id) {
  const c = id.split('').map(ch => Math.max(0, B36.indexOf(ch)));
  const g = i => c[i] === undefined ? 0 : c[i];
  return {
    species: g(0) % SPECIES.length,
    palette: pickW(g(1), W_PALETTE),
    head: pickW(g(2), W_HEAD),
    eyes: pickW(g(3), W_EYEC),
    eyeStyle: pickW(g(4), W_EYES),
    mouth: pickW(g(5), W_MOUTH),
    top: pickW(g(6), W_TOP),
    pattern: pickW(g(7), W_PATTERN),
    accessory: pickW(g(8), W_ACC),
    wild: g(9)
  };
}

function randomId() {
  const r = () => Math.floor(Math.random() * 36);
  let s = '';
  for (let i = 0; i < 10; i++) s += B36[r()];
  return s;
}

let model = null;
let currentId = '';
let pal = null;

function addShape(shapes, pts, opts, rng, intensity) {
  const offs = pts.map(() => [0, 0]);
  shapes.push(Object.assign({ pts, offs, closed: true, lw: 3.5, alpha: 1, intensity: intensity || 5 }, opts));
  return shapes[shapes.length - 1];
}

function buildModel(id) {
  const t = parseId(id);
  const rng = mulberry32(hashStr(id));
  const sp = SPECIES[t.species];
  pal = PALETTES[t.palette];
  const face = pal.face[Math.floor(rng() * pal.face.length)];
  const shapes = [];
  const sizeJit = 0.9 + rng() * 0.2;
  const headPts = headPoints(HEAD_SHAPES[t.head], sp.rx * sizeJit, sp.ry * sizeJit, 7, rng);
  const rx = Math.max(...headPts.map(p => Math.abs(p[0])));
  const ry = Math.max(...headPts.map(p => Math.abs(p[1])));
  const earRx = widthAt(headPts, -ry * 0.7, ry * 0.3) || rx * 0.6;
  const eyeRx = widthAt(headPts, -ry * 0.18, ry * 0.3) || rx * 0.7;
  const mouthRx = widthAt(headPts, ry * 0.52, ry * 0.3) || rx * 0.7;
  const asymL = 0.65 + rng() * 0.7;
  const asymR = 0.65 + rng() * 0.7;
  const acc = ACCESSORIES[t.accessory];
  const hatWorn = acc === 'hat' || acc === 'beanie';
  const extras = [];

  const earY = -ry * 0.8;
  const earsHidden = hatWorn && (sp.ear === 'long' || sp.ear === 'tuft');
  if (earsHidden) {
  } else if (sp.ear === 'tri') {
    for (const s of [-1, 1]) {
      const a = s < 0 ? asymL : asymR, w = 52 * a, h = 62 * a;
      const ex = s * earRx * 0.55, ey = earY + ry * 0.08;
      addShape(shapes, wobblyPoly([[ex - w / 2, ey], [ex + w / 2, ey], [ex + s * 12 * a, ey - h]], 3, 5, rng),
        { fill: face, stroke: pal.line }, rng, 3);
      addShape(shapes, wobblyPoly([[ex - w / 4, ey - h * 0.12], [ex + w / 4, ey - h * 0.12], [ex + s * 10 * a, ey - h * 0.62]], 2, 3, rng),
        { fill: pal.ear, stroke: pal.line, lw: 2 }, rng, 3);
    }
  } else if (sp.ear === 'long') {
    for (const s of [-1, 1]) {
      const a = s < 0 ? asymL : asymR;
      const ex = s * earRx * 0.42, ey = -ry - 58 * a;
      addShape(shapes, wobblyCircle(ex, ey, 19 * a, 66 * a, 10, 5, rng, s * 0.12),
        { fill: face, stroke: pal.line }, rng, 3);
      addShape(shapes, wobblyCircle(ex, ey + 6, 9 * a, 44 * a, 8, 4, rng, s * 0.12),
        { fill: pal.ear, stroke: null }, rng, 3);
    }
  } else if (sp.ear === 'flop') {
    for (const s of [-1, 1]) {
      const a = s < 0 ? asymL : asymR;
      const ex = s * rx * 0.86, ey = -ry * 0.28;
      addShape(shapes, wobblyCircle(ex, ey, 17 * a, 56 * a, 10, 5, rng, s * 0.38),
        { fill: pal.ear, stroke: pal.line }, rng, 3);
    }
  } else if (sp.ear === 'round' || sp.ear === 'big') {
    const baseR = sp.ear === 'big' ? 38 : 26;
    for (const s of [-1, 1]) {
      const a = s < 0 ? asymL : asymR;
      const ex = s * earRx * 0.68, ey = earY - (sp.ear === 'big' ? 10 : 0);
      addShape(shapes, wobblyCircle(ex, ey, baseR * a, baseR * a, 10, 4, rng),
        { fill: face, stroke: pal.line }, rng, 3);
      addShape(shapes, wobblyCircle(ex, ey, baseR * 0.45 * a, baseR * 0.45 * a, 8, 3, rng),
        { fill: pal.ear, stroke: null }, rng, 3);
    }
  } else if (sp.ear === 'tuft') {
    for (const s of [-1, 1]) {
      const a = s < 0 ? asymL : asymR;
      const ex = s * earRx * 0.55, ey = -ry * 0.85;
      addShape(shapes, wobblyPoly([[ex - 14 * a, ey + 8], [ex + 14 * a, ey + 8], [ex + s * 16 * a, ey - 26 * a]], 2, 4, rng),
        { fill: face, stroke: pal.line }, rng, 3);
    }
  }

  addShape(shapes, headPts, { fill: face, stroke: pal.line, lw: 4.5 }, rng, 5);

  const pattern = PATTERNS[t.pattern];
  if (pattern === 'stripes' && !sp.patches) {
    for (let k = 0; k < 3; k++) {
      const sy = -ry * (0.42 + k * 0.14);
      const w = earRx * (0.52 - k * 0.1);
      addShape(shapes, wobblyArc(0, sy, w, 9, Math.PI * 1.12, Math.PI * 1.88, 8, 3, rng),
        { fill: null, stroke: pal.line, closed: false, lw: 5, alpha: 0.75 }, rng, 2);
    }
    for (const s of [-1, 1]) {
      for (let k = 0; k < 2; k++) {
        const sy = ry * (0.12 + k * 0.2);
        addShape(shapes, wobblyArc(s * mouthRx * 0.9, sy, 16, 6, s > 0 ? -0.9 : Math.PI - 0.9, s > 0 ? 0.9 : Math.PI + 0.9, 6, 2.5, rng),
          { fill: null, stroke: pal.line, closed: false, lw: 4, alpha: 0.75 }, rng, 2);
      }
    }
  } else if (pattern === 'spots' && !sp.patches) {
    const n = 2 + Math.floor(rng() * 3);
    for (let i = 0; i < n; i++) {
      const s = rng() < 0.5 ? -1 : 1;
      const sx = s * (rx * 0.3 + rng() * rx * 0.45);
      const sy = -ry * 0.65 + rng() * ry * 0.75;
      addShape(shapes, wobblyCircle(sx, sy, 10 + rng() * 14, 8 + rng() * 10, 8, 4, rng, rng() * 3),
        { fill: pal.ear, stroke: null, alpha: 0.45 }, rng, 2);
    }
  } else if (pattern === 'mask' && !sp.patches) {
    addShape(shapes, wobblyCircle(0, -ry * 0.18, eyeRx * 0.95, ry * 0.3, 14, 5, rng),
      { fill: pal.line, stroke: null, alpha: 0.16 }, rng, 2);
  } else if (pattern === 'patch' && !sp.patches) {
    const s = rng() < 0.5 ? -1 : 1;
    addShape(shapes, wobblyCircle(s * eyeRx * 0.45, -ry * 0.2, 26 + rng() * 8, 30 + rng() * 8, 10, 5, rng, s * 0.3),
      { fill: pal.ear, stroke: null, alpha: 0.85 }, rng, 2);
  }

  const topStyle = hatWorn ? 'none' : TOP_STYLES[t.top];
  if (topStyle === 'horns') {
    for (const s of [-1, 1]) {
      const ex = s * earRx * 0.45, ey = -ry * 0.82;
      addShape(shapes, wobblyPoly([[ex - 17, ey], [ex + 17, ey], [ex + s * 14, ey - 55]], 3, 5, rng),
        { fill: pal.horn, stroke: pal.line }, rng, 8);
    }
  } else if (topStyle === 'antenna') {
    const n = 1 + Math.floor(rng() * 2);
    for (let k = 0; k < n; k++) {
      const ex = n === 1 ? 0 : (k === 0 ? -earRx * 0.35 : earRx * 0.35);
      const top = [ex + (rng() - .5) * 20, -ry - 62 - rng() * 20];
      addShape(shapes, [[ex, -ry + 4], [ex + 8, -ry - 22], [ex - 6, -ry - 42], top], { fill: null, stroke: pal.line, closed: false, lw: 3 }, rng, 11);
      addShape(shapes, wobblyCircle(top[0], top[1], 10, 10, 8, 3, rng), { fill: pal.horn, stroke: pal.line, lw: 2.5 }, rng, 11);
    }
  } else if (topStyle === 'mohawk') {
    const n = 3 + Math.floor(rng() * 3);
    for (let i = 0; i < n; i++) {
      const fx = -earRx * 0.5 + earRx * i / (n - 1);
      const ey = -ry * Math.sqrt(Math.max(0, 1 - (fx / rx) * (fx / rx)));
      const h = 22 + rng() * 14;
      addShape(shapes, wobblyPoly([[fx - 13, ey + 4], [fx + 13, ey + 4], [fx, ey - h]], 2, 4, rng),
        { fill: pal.horn, stroke: pal.line, lw: 2.5 }, rng, 8);
    }
  } else if (topStyle === 'halo') {
    addShape(shapes, wobblyCircle(0, -ry - 34, 30, 8, 12, 3, rng), { fill: null, stroke: pal.horn, lw: 4.5 }, rng, 12);
  }

  const eyeCount = t.eyes + 1;
  const eyeStyle = EYE_STYLES[t.eyeStyle];
  const eyeR = Math.max(9, Math.min(27 - eyeCount * 3, eyeRx * (eyeCount > 2 ? 0.32 : 0.42)));
  const spread = eyeCount === 1 ? 0 : eyeRx * 0.62;
  const eyePos = [];
  const eyepatchEye = acc === 'eyepatch' && eyeCount > 1 && !sp.patches ? Math.floor(rng() * Math.min(2, eyeCount)) : -1;

  if (eyepatchEye >= 0) {
    const [px, py] = [-spread + 2 * spread * eyepatchEye / (eyeCount - 1), -ry * 0.18];
    addShape(shapes, [[-rx * 1.05, py - 26], [0, py - 10], [rx * 1.05, py + 6]],
      { fill: null, stroke: pal.line, closed: false, lw: 6 }, rng, 4);
  }

  for (let i = 0; i < eyeCount; i++) {
    const fx = eyeCount === 1 ? 0 : -spread + 2 * spread * i / (eyeCount - 1);
    const ex = fx + (rng() - .5) * 10;
    const ey = -ry * 0.18 + (rng() - .5) * 14 - (eyeCount > 2 && i % 2 ? 8 : 0);
    const er = eyeR * (t.wild % 5 === 4 ? (i === 0 ? 1.3 : 0.75) : 1);
    eyePos.push([ex, ey, er]);
    if (sp.patches && i < 2) {
      addShape(shapes, wobblyCircle(ex, ey, er * 1.6, er * 1.9, 10, 4, rng, (ex < 0 ? -1 : 1) * 0.35),
        { fill: pal.line, stroke: null, alpha: 0.85 }, rng, 4);
    }
    if (i === eyepatchEye) continue;
    if (eyeStyle === 'closed' || (eyeStyle === 'wink' && i === 0)) {
      addShape(shapes, wobblyArc(ex, ey + er * 0.25, er * 0.8, er * 0.7, Math.PI + 0.2, Math.PI * 2 - 0.2, 8, 3, rng),
        { fill: null, stroke: pal.line, closed: false, lw: 4 }, rng, 12);
      continue;
    }
    addShape(shapes, wobblyCircle(ex, ey, er, er * (0.85 + rng() * 0.3), 12, 4, rng),
      { fill: pal.eye, stroke: pal.line }, rng, 12);
    if (eyeStyle === 'dead') {
      const s = er * 0.55;
      addShape(shapes, [[ex - s, ey - s], [ex, ey], [ex + s, ey + s]], { fill: null, stroke: pal.pupil, closed: false, lw: 3.5 }, rng, 12);
      addShape(shapes, [[ex + s, ey - s], [ex, ey], [ex - s, ey + s]], { fill: null, stroke: pal.pupil, closed: false, lw: 3.5 }, rng, 12);
    } else if (eyeStyle === 'chameleon') {
      addShape(shapes, wobblyCircle(ex, ey, er * 0.6, 2.5, 8, 2, rng, (rng() - .5) * 1.2),
        { fill: pal.pupil, stroke: null, follow: { x: ex, y: ey, max: er * 0.5 } }, rng, 4);
    } else if (eyeStyle === 'star') {
      addShape(shapes, wobblyPoly(starVerts(ex, ey, er * 0.5, er * 0.22, 5, -Math.PI / 2), 1, 2, rng),
        { fill: pal.pupil, stroke: null, follow: { x: ex, y: ey, max: er * 0.5 } }, rng, 4);
    } else if (eyeStyle === 'googly') {
      const ga = rng() * 6.283, gd = er * (0.3 + rng() * 0.3);
      addShape(shapes, wobblyCircle(ex + Math.cos(ga) * gd, ey + Math.sin(ga) * gd, er * 0.3, er * 0.3, 10, 2, rng),
        { fill: pal.pupil, stroke: null }, rng, 10);
    } else if (eyeStyle === 'ring') {
      addShape(shapes, wobblyCircle(ex, ey, er * 0.38, er * 0.38, 10, 2, rng),
        { fill: null, stroke: pal.pupil, lw: 3, follow: { x: ex, y: ey, max: er * 0.55 } }, rng, 4);
    } else {
      const pr = eyeStyle === 'dot' ? er * 0.22 : er * 0.45;
      addShape(shapes, wobblyCircle(ex, ey, pr, pr, 10, 2, rng),
        { fill: pal.pupil, stroke: null, follow: { x: ex, y: ey, max: er * 0.55 } }, rng, 4);
      if (eyeStyle === 'lazy') {
        addShape(shapes, wobblyArc(ex, ey - er * 0.05, er * 1.05, er * 0.8, Math.PI * 1.08, Math.PI * 1.92, 8, 3, rng),
          { fill: null, stroke: pal.line, closed: false, lw: 4 }, rng, 12);
      }
    }
  }

  if (eyepatchEye >= 0) {
    const [ex, ey, er] = eyePos[eyepatchEye];
    addShape(shapes, wobblyCircle(ex, ey, er * 1.1, er * 1.2, 10, 3, rng, 0.15),
      { fill: pal.line, stroke: pal.line, lw: 2 }, rng, 12);
    extras.push('eyepatch');
  }

  if (sp.name === 'owl' && t.wild >= 30 && eyeCount >= 2 && eyepatchEye < 0) {
    const [lx, ly, lr] = eyePos[0], [rx2, ry2, rr] = eyePos[1];
    for (const [ex, ey, er] of [eyePos[0], eyePos[1]]) {
      addShape(shapes, wobblyCircle(ex, ey, er * 1.3, er * 1.3, 12, 2.5, rng), { fill: null, stroke: pal.line, lw: 3 }, rng, 6);
    }
    addShape(shapes, [[lx + lr * 1.3, ly], [rx2 - rr * 1.3, ry2]], { fill: null, stroke: pal.line, closed: false, lw: 3 }, rng, 6);
    extras.push('glasses');
  }

  const snoutMouth = sp.nose === 'snout';
  const myBase = snoutMouth ? ry * 0.66 : ry * 0.52;

  if (sp.beak) {
    addShape(shapes, wobblyPoly([[-sp.beak * 0.55, ry * 0.02], [sp.beak * 0.55, ry * 0.02], [0, ry * 0.02 + sp.beak]], 3, 4, rng),
      { fill: pal.horn, stroke: pal.line }, rng, 10);
  } else if (sp.nose === 'snout') {
    addShape(shapes, wobblyCircle(0, ry * 0.34, 27, 17, 10, 3.5, rng), { fill: face, stroke: pal.line, lw: 3 }, rng, 10);
    addShape(shapes, wobblyPoly([[-10, ry * 0.26], [10, ry * 0.26], [0, ry * 0.26 + 11]], 2, 3, rng),
      { fill: pal.nose, stroke: pal.line, lw: 2 }, rng, 10);
  } else if (sp.nose === 'pig') {
    addShape(shapes, wobblyCircle(0, ry * 0.22, 17, 12, 10, 3, rng), { fill: pal.nose, stroke: pal.line, lw: 2.5 }, rng, 10);
    for (const s of [-1, 1]) {
      addShape(shapes, wobblyCircle(s * 7, ry * 0.22, 3, 4, 6, 1.5, rng), { fill: pal.line, stroke: null }, rng, 10);
    }
  } else if (sp.nose === 'round') {
    addShape(shapes, wobblyCircle(0, ry * 0.2, 13, 9, 10, 3, rng), { fill: pal.nose, stroke: pal.line, lw: 2.5 }, rng, 10);
  } else if (sp.nose === 'dots') {
    for (const s of [-1, 1]) {
      addShape(shapes, wobblyCircle(s * 9, ry * 0.12, 3.5, 3.5, 6, 1.5, rng), { fill: pal.nose, stroke: pal.line, lw: 1.5 }, rng, 10);
    }
  } else if (sp.nose === 'tri') {
    addShape(shapes, wobblyPoly([[-9, ry * 0.14], [9, ry * 0.14], [0, ry * 0.14 + 10]], 2, 3, rng),
      { fill: pal.nose, stroke: pal.line, lw: 2 }, rng, 10);
  }

  if (acc === 'nosering' && !sp.beak && sp.nose !== 'none' && sp.nose !== 'dots') {
    const ny = sp.nose === 'snout' ? ry * 0.46 : ry * 0.32;
    addShape(shapes, wobblyCircle(0, ny, 7, 7, 8, 2, rng), { fill: null, stroke: pal.horn, lw: 2.5 }, rng, 10);
    extras.push('nosering');
  }

  const mouthStyle = MOUTH_STYLES[t.mouth];
  const my = myBase, mw = Math.min(34, mouthRx * 0.55), mh = 24;
  const smileArcY = (tx) => my - 12 + mh * Math.sin(Math.PI * Math.max(0, Math.min(1, (tx + mw) / (2 * mw))));
  let teethCurve = null, teethH = 0;

  if (mouthStyle === 'smile') {
    addShape(shapes, wobblyArc(0, my - 12, mw, mh, 0.1, Math.PI - 0.1, 12, 4, rng), { fill: null, stroke: pal.line, closed: false, lw: 3.5 }, rng, 8);
    teethCurve = smileArcY; teethH = 7 + rng() * 4;
  } else if (mouthStyle === 'chill') {
    addShape(shapes, wobblyArc(0, my - 6, mw * 0.8, 5, 0.1, Math.PI - 0.1, 10, 3, rng), { fill: null, stroke: pal.line, closed: false, lw: 3 }, rng, 8);
  } else if (mouthStyle === 'mad') {
    addShape(shapes, wobblyArc(0, my + 12, mw * 0.9, 18, Math.PI + 0.15, Math.PI * 2 - 0.15, 12, 4, rng), { fill: null, stroke: pal.line, closed: false, lw: 3.5 }, rng, 8);
  } else if (mouthStyle === 'open') {
    addShape(shapes, wobblyCircle(0, my - 2, mw * 0.75, mh * 0.8, 12, 4, rng), { fill: pal.line, stroke: pal.line, lw: 2 }, rng, 8);
    addShape(shapes, wobblyCircle(0, my + mh * 0.35, mw * 0.38, mh * 0.28, 10, 3, rng), { fill: pal.mouth, stroke: null }, rng, 8);
    teethCurve = () => my - 2 - mh * 0.62; teethH = mh * 0.55;
  } else if (mouthStyle === 'fangs') {
    addShape(shapes, wobblyArc(0, my - 12, mw, mh, 0.1, Math.PI - 0.1, 12, 4, rng), { fill: null, stroke: pal.line, closed: false, lw: 3.5 }, rng, 8);
    for (const s of [-1, 1]) {
      const fx = s * mw * 0.62, fy = smileArcY(fx);
      addShape(shapes, wobblyPoly([[fx - 7, fy - 2], [fx + 7, fy - 2], [fx, fy + 16]], 2, 2.5, rng),
        { fill: pal.teeth, stroke: pal.line, lw: 1.8 }, rng, 8);
    }
  } else if (mouthStyle === 'tongue') {
    addShape(shapes, wobblyArc(0, my - 12, mw, mh, 0.1, Math.PI - 0.1, 12, 4, rng), { fill: null, stroke: pal.line, closed: false, lw: 3.5 }, rng, 8);
    addShape(shapes, wobblyCircle(0, my + 14, 12, 15, 10, 3, rng), { fill: pal.mouth, stroke: pal.line, lw: 2.5 }, rng, 9);
    addShape(shapes, [[0, my + 4], [0, my + 20]], { fill: null, stroke: pal.line, closed: false, lw: 1.8 }, rng, 9);
  } else if (mouthStyle === 'w') {
    for (const s of [-1, 1]) {
      addShape(shapes, wobblyArc(s * 11, my - 8, 11, 9, 0.05, Math.PI - 0.05, 8, 2.5, rng), { fill: null, stroke: pal.line, closed: false, lw: 3 }, rng, 8);
    }
  } else if (mouthStyle === 'zigzag') {
    const pts = [];
    const zw = mw * 1.3, n = 6;
    for (let i = 0; i <= n; i++) {
      pts.push([-zw / 2 + zw * i / n, my - 4 + (i % 2 === 0 ? -5 : 5) + (rng() - .5) * 3]);
    }
    addShape(shapes, pts, { fill: null, stroke: pal.line, closed: false, lw: 3.5 }, rng, 8);
  } else if (mouthStyle === 'o') {
    addShape(shapes, wobblyCircle(0, my - 4, 9 + rng() * 3, 10 + rng() * 4, 10, 3, rng), { fill: pal.line, stroke: pal.line, lw: 2 }, rng, 8);
  } else if (mouthStyle === 'grin') {
    addShape(shapes, wobblyCircle(0, my - 4, mw * 0.95, mh * 0.55, 12, 4, rng), { fill: pal.line, stroke: pal.line, lw: 2 }, rng, 8);
    const n = 5 + t.wild % 3;
    for (let i = 0; i < n; i++) {
      const tx = -mw * 0.72 + mw * 1.44 * i / (n - 1);
      addShape(shapes, wobblyPoly([[tx - 6, my - 4 - mh * 0.4], [tx + 6, my - 4 - mh * 0.4], [tx, my - 4 + mh * 0.12]], 2, 1.8, rng),
        { fill: pal.teeth, stroke: null }, rng, 8);
    }
  } else if (mouthStyle === 'smirk') {
    addShape(shapes, wobblyArc(mw * 0.3, my - 10, mw * 0.7, mh * 0.75, 0.15, Math.PI * 0.85, 10, 3.5, rng, -0.12),
      { fill: null, stroke: pal.line, closed: false, lw: 3.5 }, rng, 8);
  }

  if ((mouthStyle === 'smile' || mouthStyle === 'open') && (topStyle === 'horns' || t.wild % 4 === 2)) {
    const n = 2 + t.wild % 3;
    const lim = mouthStyle === 'open' ? mw * 0.5 : mw * 0.75;
    for (let i = 0; i < n; i++) {
      const tx = -lim + 2 * lim * (n === 1 ? 0.5 : i / (n - 1));
      const by = teethCurve(tx);
      const w = 8 + rng() * 4, h = Math.min(teethH, 7 + rng() * 6);
      addShape(shapes, wobblyPoly([[tx - w / 2, by], [tx + w / 2, by], [tx, by + h]], 2, 2, rng),
        { fill: pal.teeth, stroke: pal.line, lw: 1.8 }, rng, 8);
    }
  }

  if (sp.name === 'rabbit' && t.wild >= 29 && (mouthStyle === 'smile' || mouthStyle === 'chill' || mouthStyle === 'w')) {
    const by = mouthStyle === 'smile' ? smileArcY(0) : my - 6;
    for (const s of [-1, 1]) {
      addShape(shapes, wobblyPoly([[s * 8 - 6, by], [s * 8 + 6, by], [s * 8 + 5, by + 14], [s * 8 - 5, by + 14]], 2, 2, rng),
        { fill: pal.teeth, stroke: pal.line, lw: 1.8 }, rng, 8);
    }
    extras.push('buckteeth');
  }

  if (sp.name === 'dog' && t.wild >= 31 && (mouthStyle === 'tongue' || mouthStyle === 'open')) {
    const dy = mouthStyle === 'open' ? my + mh * 0.6 : my + 26;
    addShape(shapes, [[mw * 0.3, dy - 8], [mw * 0.3, dy + 2]], { fill: null, stroke: pal.eye, closed: false, lw: 2.5 }, rng, 9);
    addShape(shapes, wobblyCircle(mw * 0.3, dy + 8, 4.5, 5.5, 8, 2, rng), { fill: pal.eye, stroke: pal.line, lw: 1.5 }, rng, 9);
    extras.push('drool');
  }

  if (acc === 'blush') {
    for (const s of [-1, 1]) {
      addShape(shapes, wobblyCircle(s * mouthRx * 0.72, myBase - ry * 0.22, 11 + rng() * 4, 7 + rng() * 3, 8, 2.5, rng),
        { fill: pal.mouth, stroke: null, alpha: 0.55 }, rng, 3);
    }
  } else if (acc === 'brows' && eyePos.length && eyeStyle !== 'closed') {
    const anger = rng() * 0.5 - 0.25;
    for (const [ex, ey] of eyePos.slice(0, 2)) {
      const s = Math.sign(ex) || 1;
      addShape(shapes, [[ex - eyeR * 0.9, ey - eyeR * 1.7 - s * anger * 20], [ex + eyeR * 0.9, ey - eyeR * 1.5 + s * anger * 20]],
        { fill: null, stroke: pal.line, closed: false, lw: 4 }, rng, 8);
    }
  } else if (acc === 'whiskers' && !sp.beak) {
    for (const s of [-1, 1]) {
      for (let k = 0; k < 3; k++) {
        const wy = myBase - ry * 0.24 + k * 9;
        addShape(shapes, wobblyArc(s * (mouthRx * 0.55 + 24), wy - 4, 26, 5, s > 0 ? -0.5 : Math.PI - 0.5 + 0.001, s > 0 ? 0.5 : Math.PI + 0.5, 6, 2.5, rng),
          { fill: null, stroke: pal.line, closed: false, lw: 1.8 }, rng, 6);
      }
    }
  } else if (acc === 'scar') {
    const s = rng() < 0.5 ? -1 : 1;
    const x0 = s * earRx * 0.35, y0 = -ry * 0.55, x1 = s * earRx * 0.6, y1 = -ry * 0.28;
    addShape(shapes, [[x0, y0], [x1, y1]], { fill: null, stroke: pal.line, closed: false, lw: 2.5 }, rng, 3);
    for (let k = 0; k < 3; k++) {
      const f = 0.2 + k * 0.3;
      const px = x0 + (x1 - x0) * f, py = y0 + (y1 - y0) * f;
      addShape(shapes, [[px - 5, py + 2], [px + 5, py - 2]], { fill: null, stroke: pal.line, closed: false, lw: 2 }, rng, 3);
    }
  } else if (acc === 'piercing') {
    const s = rng() < 0.5 ? -1 : 1;
    const py = ry * 0.18;
    const exx = s * (widthAt(headPts, py, ry * 0.2) || rx) * 0.96;
    addShape(shapes, wobblyCircle(exx, py, 6.5, 6.5, 8, 2, rng), { fill: null, stroke: pal.horn, lw: 2.5 }, rng, 10);
    addShape(shapes, wobblyCircle(exx, py - 7, 2.5, 2.5, 6, 1.5, rng), { fill: pal.horn, stroke: null }, rng, 10);
    extras.push('piercing');
  } else if (acc === 'hat') {
    const hy = -ry * 0.62, tilt = (rng() - .5) * 0.25;
    const dome = wobblyArc(0, hy, earRx * 0.62, 44, Math.PI, Math.PI * 2, 12, 5, rng)
      .map(([x, y]) => rotatePt(x, y, 0, hy, tilt));
    addShape(shapes, dome, { fill: pal.horn, stroke: pal.line }, rng, 8);
    const brim = wobblyCircle(earRx * 0.2, hy + 2, earRx * 0.95, 10, 12, 4, rng, tilt)
      .map(([x, y]) => rotatePt(x, y, 0, hy, tilt));
    addShape(shapes, brim, { fill: pal.horn, stroke: pal.line }, rng, 8);
    extras.push('hat');
  } else if (acc === 'beanie') {
    const hy = -ry * 0.52;
    addShape(shapes, wobblyCircle(0, hy - 6, earRx * 0.62, 34, 12, 5, rng), { fill: pal.horn, stroke: pal.line }, rng, 8);
    addShape(shapes, wobblyPoly([[-earRx * 0.64, hy + 12], [earRx * 0.64, hy + 12], [earRx * 0.64, hy + 27], [-earRx * 0.64, hy + 27]], 4, 3, rng),
      { fill: pal.ear, stroke: pal.line, lw: 2.5 }, rng, 8);
    addShape(shapes, wobblyCircle(0, hy - 40, 10, 10, 8, 3, rng), { fill: pal.ear, stroke: pal.line, lw: 2 }, rng, 10);
    extras.push('beanie');
  }

  if (!hatWorn && sp.name === 'frog' && t.wild >= 32) {
    const cy = -ry * 0.88, cw = 30;
    const verts = [[-cw, cy + 12], [-cw, cy - 8], [-cw * 0.5, cy + 2], [0, cy - 16], [cw * 0.5, cy + 2], [cw, cy - 8], [cw, cy + 12]];
    addShape(shapes, wobblyPoly(verts, 2, 2.5, rng), { fill: pal.horn, stroke: pal.line, lw: 2.5 }, rng, 9);
    extras.push('crown');
  }

  if (!hatWorn && sp.name === 'mouse' && t.wild >= 32) {
    const cy = -ry * 0.85;
    addShape(shapes, wobblyPoly([[-24, cy + 10], [26, cy + 4], [-16, cy - 22]], 3, 3, rng), { fill: pal.horn, stroke: pal.line, lw: 2.5 }, rng, 9);
    for (let k = 0; k < 2; k++) {
      addShape(shapes, wobblyCircle(-6 + k * 14, cy - 4 + k * 4, 3.5, 3.5, 6, 1.5, rng), { fill: pal.bg, stroke: null }, rng, 9);
    }
    extras.push('cheese');
  }

  if (sp.name === 'pig' && t.wild >= 30) {
    const n = 3 + t.wild % 3;
    for (let i = 0; i < n; i++) {
      const s = rng() < 0.5 ? -1 : 1;
      addShape(shapes, wobblyCircle(s * rng() * mouthRx * 0.85, ry * (0.1 + rng() * 0.55), 8 + rng() * 10, 6 + rng() * 8, 8, 4, rng, rng() * 3),
        { fill: pal.nose, stroke: null, alpha: 0.4 }, rng, 2);
    }
    extras.push('mud');
  }

  const traitList = [sp.name, HEAD_SHAPES[t.head], pal.name, eyeCount + ' eye' + (eyeCount > 1 ? 's' : ''), eyeStyle, mouthStyle];
  if (topStyle !== 'none') traitList.push(topStyle);
  if (pattern !== 'none' && !sp.patches) traitList.push(pattern);
  if (acc !== 'none' && !['eyepatch', 'piercing', 'nosering', 'hat', 'beanie'].includes(acc)) traitList.push(acc);
  for (const e of extras) traitList.push(e);
  return { shapes, traits: traitList };
}

const mouse = { x: 0, y: 0, lastX: 0, lastY: 0 };
let Ui = 2, staticMode = false, frozen = false;
let drx = 0, dry = 0, angle = 0;

window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('touchmove', e => { const t = e.changedTouches[0]; mouse.x = t.pageX; mouse.y = t.pageY; }, { passive: true });
canvas.addEventListener('mousedown', () => { Ui += Ui < 50 ? 100 : 1 + 1.001 * Ui; });
canvas.addEventListener('touchstart', () => { Ui += 1 + 1.001 * Ui; }, { passive: true });

window.addEventListener('keydown', e => {
  if (e.keyCode === 76) loadCritter(randomId());
  else if (e.keyCode === 32) { staticMode = !staticMode; if (staticMode) frozen = false; }
  else if (e.keyCode === 65) { frozen = !frozen; if (frozen) staticMode = false; }
  else if (e.keyCode === 83) savePng();
});

const FRICTION = 0.2;

function drawPath(sh) {
  const pts = sh.pts, offs = sh.offs, n = pts.length;
  const fdx = sh.follow ? sh.follow.dx || 0 : 0;
  const fdy = sh.follow ? sh.follow.dy || 0 : 0;
  const I = sh.intensity;
  const lean = 10 * I;
  const lx = Math.sin(angle) * Math.abs(drx * lean);
  const ly = Math.cos(angle) * Math.abs(dry * lean);
  const j = Ui * 0.5 * (0.4 + I * 0.08);
  const P = (i) => {
    const k = ((i % n) + n) % n;
    const o = offs[k];
    if (!frozen) {
      o[0] += (lx + (Math.random() - .5) * j - o[0]) * FRICTION;
      o[1] += (ly + (Math.random() - .5) * j - o[1]) * FRICTION;
    }
    return [pts[k][0] + fdx + o[0], pts[k][1] + fdy + o[1]];
  };
  ctx.beginPath();
  if (sh.closed) {
    const a = P(n - 1), b = P(0);
    ctx.moveTo((a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    for (let i = 0; i < n; i++) { const p = P(i), q = P(i + 1); ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.closePath();
  } else {
    const p0 = P(0);
    ctx.moveTo(p0[0], p0[1]);
    for (let i = 1; i < n - 1; i++) { const p = P(i), q = P(i + 1); ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    const pl = P(n - 1);
    ctx.lineTo(pl[0], pl[1]);
  }
  if (sh.alpha !== 1) ctx.globalAlpha = sh.alpha;
  if (sh.fill) { ctx.fillStyle = sh.fill; ctx.fill(); }
  if (sh.stroke) { ctx.strokeStyle = sh.stroke; ctx.lineWidth = sh.lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
  if (sh.alpha !== 1) ctx.globalAlpha = 1;
}

let smx = 0, smy = 0;
function frame() {
  requestAnimationFrame(frame);

  if (staticMode || frozen) Ui = 0;
  else {
    Ui += 0.05 * (0 - Ui);
    Ui = Math.min(Ui, 1500);
    if (Ui < 5) Ui = 2;
  }

  const tDrx = staticMode ? 0 : (mouse.x - W / 2) / W * 0.5;
  const tDry = staticMode ? 0 : (mouse.y - H / 2) / H * 0.5;
  drx += (tDrx - drx) * 0.15;
  dry += (tDry - dry) * 0.15;
  angle = Math.atan2(mouse.x - W / 2, mouse.y - H / 2);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = pal.bg;
  ctx.fillRect(0, 0, W, H);

  const S = Math.min(W, H) / 470;
  const mmx = (mouse.x - W / 2) / S, mmy = (mouse.y - H / 2) / S;
  smx += (mmx - smx) * 0.07;
  smy += (mmy - smy) * 0.07;
  const swayX = frozen || staticMode ? 0 : smx * 0.03, swayY = frozen || staticMode ? 0 : smy * 0.03;
  const swayR = frozen || staticMode ? 0 : smx * 0.0004;

  ctx.save();
  ctx.translate(W / 2 + swayX * S, H / 2 + swayY * S + 12 * S);
  ctx.rotate(swayR);
  ctx.scale(S, S);

  if (model) {
    for (const sh of model.shapes) {
      if (sh.follow) {
        const f = sh.follow;
        if (!frozen && !staticMode) {
          const a = Math.atan2(smy - f.y, smx - f.x);
          const d = Math.min(Math.hypot(smx - f.x, smy - f.y) * 0.35, f.max);
          f.tx = Math.cos(a) * d; f.ty = Math.sin(a) * d;
        } else if (staticMode) { f.tx = 0; f.ty = 0; }
        f.dx = (f.dx || 0) + ((f.tx || 0) - (f.dx || 0)) * 0.15;
        f.dy = (f.dy || 0) + ((f.ty || 0) - (f.dy || 0)) * 0.15;
      }
      drawPath(sh);
    }
  }
  ctx.restore();
}
requestAnimationFrame(frame);

function luminance(hex) {
  const r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16);
  return (299 * r + 587 * g + 114 * b) / 1000;
}

function loadCritter(id) {
  currentId = id;
  model = buildModel(id);
  document.body.style.background = pal.bg;
  titleEl.textContent = 'the critter @' + id;
  descEl.textContent = model.traits.join(' · ') + ' — L random · space static · A freeze · S save';
  const fg = luminance(pal.bg) >= 128 ? '#000' : '#fff';
  titleEl.style.color = fg; descEl.style.color = fg;
  window.location.hash = id;
}

function savePng() {
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'critter-' + currentId + '.png';
    a.click();
    URL.revokeObjectURL(a.href);
  });
}

document.getElementById('btn-random').addEventListener('click', () => loadCritter(randomId()));
document.getElementById('btn-save').addEventListener('click', savePng);

(function init() {
  const h = window.location.hash.slice(1);
  loadCritter(/^[0-9a-z]{6,10}$/.test(h) ? h : randomId());
})();
</script>
