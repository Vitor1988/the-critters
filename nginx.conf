server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O tracker e o rig vivem no engine.js/rig-page.js: sem cache longa, senão um deploy
    # deixa metade dos clientes com a versão antiga do rig e a nova das páginas.
    location ~* \.(js|html)$ {
        add_header Cache-Control "no-cache";
    }

    # Sincronização das preferências sem backend: o módulo WebDAV do nginx aceita o PUT
    # do JSON e serve-o de volta no GET. Fica no volume, portanto sobrevive a rebuilds.
    # Sem autenticação de propósito — isto só existe dentro da tailnet.
    location /data/ {
        alias /var/lib/critters/;
        dav_methods PUT DELETE;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        client_max_body_size 4m;
        autoindex off;
        add_header Cache-Control "no-store";
    }
}
