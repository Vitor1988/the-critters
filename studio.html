<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>the critters — studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@500;900&display=swap');
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f2f2f2;overscroll-behavior:none;overflow:hidden}
#render{position:absolute;top:0;left:0}
.content{position:relative;margin-top:20px;margin-left:20px;text-align:left;color:#000;z-index:1001;pointer-events:none}
.header{letter-spacing:0;font-size:24px;font-family:'Source Code Pro',monospace;font-weight:600}
.header h1{margin:0;font-size:24px}
.description{font-size:14px;font-family:'Source Code Pro',monospace;margin-top:12px;width:520px;max-width:calc(100vw - 40px);line-height:1.5}
.navigation{margin-top:16px;pointer-events:auto}
button{border:0;background:#000;color:#fff;padding:14px 18px;margin-right:8px;font-size:14px;font-family:'Source Code Pro',monospace;cursor:pointer}
button:hover{opacity:.75}
.favs{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto;max-width:min(620px,calc(100vw - 40px))}
.fav-chip{background:none;border:2px solid currentColor;color:inherit;padding:5px 9px;margin:0;font-size:12px;font-family:'Source Code Pro',monospace;opacity:.75}
.fav-chip:hover{opacity:1}
.fav-chip.on{opacity:1;border-width:3px;font-weight:900}
button.rec-on{background:#c0261e}
#cam{position:fixed;left:16px;bottom:16px;width:180px;border-radius:8px;transform:scaleX(-1);opacity:.85;z-index:1000}
@media (max-width:600px){
  .content{margin-top:12px;margin-left:12px}
  .header h1{font-size:17px}
  .description{font-size:12px;margin-top:8px;line-height:1.4}
  .navigation{margin-top:10px}
  button{padding:10px 12px;font-size:12px;margin-right:6px;margin-bottom:6px}
  #cam{width:104px;left:10px;bottom:10px}
}
.panel{pointer-events:auto;position:fixed;right:12px;top:12px;width:230px;max-height:calc(100vh - 24px);overflow-y:auto;background:rgba(255,255,255,.92);border:2px solid #000;padding:10px 12px;font-family:'Source Code Pro',monospace;font-size:12px;z-index:1002;color:#000}
.panel summary{cursor:pointer;font-weight:900;margin-bottom:6px}
.p-row{margin:8px 0}
.p-row span{display:block;margin-bottom:3px}
.p-row select,.p-row input[type=range]{width:100%}
.p-row input[type=color]{width:100%;height:26px;border:1px solid #000;background:none;padding:0}
.p-check label{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:900}
.p-check input{width:14px;height:14px;margin:0}
.p-io{display:flex;gap:6px}
.sub{margin-top:10px;border-top:1px solid #0002;padding-top:6px}
.sub summary{cursor:pointer;font-weight:900;font-size:11px;letter-spacing:.04em;text-transform:uppercase;opacity:.7}
.p-io button{flex:1;padding:8px 6px;margin:0;font-size:11px}
/* Telemóvel: o painel deixa de ser uma coluna à direita (não cabe, transbordava o
   ecrã e tapava o critter) e passa a ser uma gaveta em baixo, fechada de início. */
@media (max-width:700px){
  .panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:min(62vh,430px);font-size:12px;
         box-shadow:0 -6px 24px rgba(0,0,0,.18)}
  .panel summary{font-size:13px;padding:2px 0}
  .p-row select,.p-row input[type=range]{height:30px}
  .p-io button{padding:11px 6px;font-size:12px}
  #cam{top:10px;right:10px;bottom:auto;width:84px}
  .favs{max-width:calc(100vw - 24px)}
}
</style>
</head>
<body>
<canvas id="render"></canvas>
<video id="cam" autoplay muted playsinline></video>
<div class="content">
  <div class="header"><h1 id="txt-title">the critters — studio</h1></div>
  <div class="description" id="txt-description">loading face tracker…</div>
  <div class="navigation">
    <button id="btn-random">random</button>
    <button id="btn-recal">recalibrate</button>
    <button id="btn-fav">♡ favorito</button>
    <button id="btn-rec">● gravar</button>
    <button id="btn-save">save png</button>
    <button id="btn-back">generative</button>
    <button id="btn-rigged">rigged</button>
    <button id="btn-reset">reset cfg</button>
  </div>
  <div id="favs" class="favs" style="display:none"></div>
  <details class="panel" open>
    <summary>studio config</summary>
    <div class="p-row"><span>palette</span><select id="cfg-palette"></select></div>
    <div class="p-row"><span>mouth</span><select id="cfg-mouth"></select></div>
    <div class="p-row"><span>background</span><input type="color" id="cfg-bg"></div>
    <div class="p-row p-io"><button id="btn-export">exportar</button><button id="btn-import">importar</button></div>
    <details class="sub" open>
      <summary>sensibilidade</summary>
      <div class="p-row p-check"><label><input type="checkbox" id="cfg-sens-local"> afinação só deste avatar</label></div>
      <div id="sliders"></div>
    </details>
  </details>
</div>
<script src="engine.js"></script>
<script src="rig-page.js"></script>
<script type="module">
import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const SLIDERS = [
  ['mouthGain', 'mouth gain', 0.4, 2],
  ['mouthWidth', 'mouth width', 0, 2],
  ['openHeight', 'open height', 0.4, 1.6],
  ['puckerFx', 'pucker fx', 0, 1.5],
  ['gazeGain', 'gaze gain', 0.3, 2],
  ['blinkGain', 'blink gain', 0.5, 2.5],
  ['headGain', 'head gain', 0, 2],
  ['headMove', 'head move', 0, 2.5],
  ['sphere', 'bola (boca/nariz)', 0, 2],
  ['lean', 'lean (olhos)', 0, 2],
  ['smooth', 'reactivity', 0.3, 2]
];

if (window.matchMedia && matchMedia('(max-width:700px)').matches) {
  document.querySelector('.panel').removeAttribute('open');
}

const palSel = document.getElementById('cfg-palette');
const mouthSel = document.getElementById('cfg-mouth');
const bgInput = document.getElementById('cfg-bg');
const localChk = document.getElementById('cfg-sens-local');

PALETTES.forEach((p, i) => palSel.add(new Option(p.name, i)));
MOUTH_STYLES.forEach((m, i) => mouthSel.add(new Option(m, i)));

const slidersEl = document.getElementById('sliders');
for (const [key, label, mn, mx] of SLIDERS) {
  const row = document.createElement('div');
  row.className = 'p-row';
  row.innerHTML = '<span>' + label + ' <b id="v-' + key + '"></b></span>' +
                  '<input type="range" id="s-' + key + '" min="' + mn + '" max="' + mx + '" step="0.05">';
  slidersEl.appendChild(row);
  row.querySelector('input').addEventListener('input', e => {
    const v = +e.target.value;
    document.getElementById('v-' + key).textContent = v.toFixed(2);
    page.SENS[key] = v;
    if (localChk.checked) {
      const c = loadCritterCfg(page.id);
      c.sens = Object.assign({}, c.sens, { [key]: v });
      saveCritterCfg(page.id, c);
    } else {
      saveGlobalSens(Object.assign(loadGlobalSens(), { [key]: v }));
    }
  });
}

/* corre a cada loadCritter (inclusive o primeiro, de dentro de startRigPage) */
function syncPanel(p) {
  const cfg = loadCritterCfg(p.id);
  const t = parseId(p.id);
  palSel.value = cfg.traits && cfg.traits.palette !== undefined ? cfg.traits.palette : t.palette;
  mouthSel.value = cfg.traits && cfg.traits.mouth !== undefined ? cfg.traits.mouth : t.mouth;
  bgInput.value = p.pal.bg;
  localChk.checked = !!p.sensLocal;
  for (const [key] of SLIDERS) {
    document.getElementById('s-' + key).value = p.SENS[key];
    document.getElementById('v-' + key).textContent = p.SENS[key].toFixed(2);
  }
}

const page = startRigPage({ FaceLandmarker, FilesetResolver, label: 'studio', onLoad: syncPanel });

function setTrait(name, value) {
  const c = loadCritterCfg(page.id);
  c.traits = Object.assign({}, c.traits, { [name]: value });
  saveCritterCfg(page.id, c);
  page.loadCritter(page.id);
}
palSel.addEventListener('change', () => setTrait('palette', +palSel.value));
mouthSel.addEventListener('change', () => setTrait('mouth', +mouthSel.value));
bgInput.addEventListener('input', e => {
  const c = loadCritterCfg(page.id);
  c.bg = e.target.value;
  saveCritterCfg(page.id, c);
  page.pal.bg = c.bg;
  document.body.style.background = c.bg;
});

/* trocar o âmbito: passar a global apaga o override deste avatar e recarrega */
localChk.addEventListener('change', () => {
  const c = loadCritterCfg(page.id);
  if (localChk.checked) c.sens = Object.assign({}, page.SENS);
  else delete c.sens;
  saveCritterCfg(page.id, c);
  page.loadCritter(page.id);
});

document.getElementById('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(exportAll(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'critters-backup.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});

document.getElementById('btn-import').addEventListener('click', () => {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.addEventListener('change', () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const n = importAll(JSON.parse(r.result));
        page.loadCritter(page.id);
        syncPush();
        page.setStatus('importado: ' + n + ' critters + favoritos + afinação');
      } catch (e) { page.setStatus('importação falhou: ' + e.message); }
    };
    r.readAsText(file);
  });
  inp.click();
});

document.getElementById('btn-rigged').addEventListener('click', () => { window.location.href = 'rigged.html' + window.location.hash; });
document.getElementById('btn-reset').addEventListener('click', () => {
  try { localStorage.removeItem('critter-cfg:' + page.id); } catch (e) {}
  page.loadCritter(page.id);
});
</script>
</body>
</html>
