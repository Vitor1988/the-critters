<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>the critters — studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@500;900&display=swap');
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#f2f2f2;overscroll-behavior:none;overflow:hidden}
#render{position:absolute;top:0;left:0;width:100%;height:100%}
.content{position:relative;margin-top:20px;margin-left:20px;text-align:left;color:#000;z-index:1001;pointer-events:none}
.header{letter-spacing:0;font-size:24px;font-family:'Source Code Pro',monospace;font-weight:600}
.header h1{margin:0;font-size:24px}
.description{font-size:14px;font-family:'Source Code Pro',monospace;margin-top:12px;width:520px;max-width:calc(100vw - 40px);line-height:1.5}
.navigation{margin-top:16px;pointer-events:auto}
button{border:0;background:#000;color:#fff;padding:14px 18px;margin-right:8px;font-size:14px;font-family:'Source Code Pro',monospace;cursor:pointer}
button:hover{opacity:.75}
.favs{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto;max-width:min(620px,calc(100vw - 40px))}
.fav-chip{background:none;border:2px solid currentColor;color:inherit;padding:5px 9px;margin:0;font-size:12px;font-family:'Source Code Pro',monospace;opacity:.75}
.fav-chip:hover{opacity:1}
.fav-chip.on{opacity:1;border-width:3px;font-weight:900}
button.rec-on{background:#c0261e}
#cam{position:fixed;left:16px;bottom:16px;width:180px;border-radius:8px;transform:scaleX(-1);opacity:.85;z-index:1000}
@media (max-width:600px){
  .content{margin-top:12px;margin-left:12px}
  .header h1{font-size:17px}
  .description{font-size:12px;margin-top:8px;line-height:1.4}
  /* flex com wrap: a quebra de linha de inline-blocks deixava um botão a transbordar
     pela direita quando a linha enchia ao pixel — com flex o embrulho é garantido */
  .navigation{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .navigation button{margin:0}
  button{padding:10px 12px;font-size:12px}
}
.panel{pointer-events:auto;position:fixed;right:12px;top:12px;width:min(230px,44vw);max-height:calc(100vh - 24px);overflow-y:auto;background:rgba(255,255,255,.92);border:2px solid #000;padding:10px 12px;font-family:'Source Code Pro',monospace;font-size:12px;z-index:1002;color:#000}
.panel summary{cursor:pointer;font-weight:900;margin-bottom:6px}
.p-row{margin:8px 0}
.p-row span{display:block;margin-bottom:3px}
.p-row select,.p-row input[type=range]{width:100%}
.p-row input[type=color]{width:100%;height:26px;border:1px solid #000;background:none;padding:0}
.p-check label{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:900}
.p-check input{width:14px;height:14px;margin:0}
.p-io{display:flex;gap:6px}
.sub{margin-top:10px;border-top:1px solid #0002;padding-top:6px}
.sub summary{cursor:pointer;font-weight:900;font-size:11px;letter-spacing:.04em;text-transform:uppercase;opacity:.7}
.s-h{margin:12px 0 2px;font-weight:900;font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.5;border-bottom:1px solid #0002;padding-bottom:2px}
.p-io button{flex:1;padding:8px 6px;margin:0;font-size:11px}
/* Telemóvel: nada de sobreposições nem position:fixed. Com overflow:hidden a página não
   rola, o browser nunca recolhe a barra, e o viewport de layout nunca coincide com o que
   está visível — foi isso que matou todas as variantes de gaveta ancorada em baixo (por
   CSS `bottom`, por Visual Viewport, por JS). Em vez disso a página passa a fluxo normal
   com scroll nativo: canvas em cima, texto, botões e o painel por baixo. O que não couber
   rola — o browser é que sabe o que está visível, não nós. A câmara continua escondida:
   é só uma pré-visualização e andava sempre a chocar com o cabeçalho. */
@media (max-width:700px), (pointer:coarse) and (max-width:1024px){
  html,body{height:auto;overflow-y:auto;overflow-x:hidden}
  #render{position:static;width:100%;height:42vh}
  .content{margin:10px 12px 16px}
  .navigation{display:flex;flex-wrap:wrap;gap:6px}
  .navigation button{margin:0}
  .panel{position:static;width:auto;max-height:none;margin-top:12px;font-size:12px}
  .panel summary{font-size:14px;padding:10px 0;text-align:center;border:2px solid #000;
                 margin:-2px -4px 6px;background:#000;color:#fff}
  .p-row select,.p-row input[type=range]{height:32px}
  .p-io button{padding:11px 6px;font-size:12px}
  #cam{display:none}
  .favs{max-width:calc(100vw - 24px)}
}
/* svh = altura com a barra do browser à vista, estável (não salta ao rolar como vh/dvh) */
@supports (height:1svh){
  @media (max-width:700px), (pointer:coarse) and (max-width:1024px){
    #render{height:46svh}
  }
}
</style>
</head>
<body>
<canvas id="render"></canvas>
<video id="cam" autoplay muted playsinline></video>
<div class="content">
  <div class="header"><h1 id="txt-title">the critters — studio</h1></div>
  <div class="description" id="txt-description">loading face tracker…</div>
  <div class="navigation">
    <button id="btn-random">random</button>
    <button id="btn-recal">recalibrate</button>
    <button id="btn-max">calibrar máximo</button>
    <button id="btn-fav">♡ favorito</button>
    <button id="btn-rec">● gravar</button>
    <button id="btn-save">save png</button>
    <button id="btn-back">generative</button>
    <button id="btn-rigged">rigged</button>
    <button id="btn-reset">reset cfg</button>
  </div>
  <div id="favs" class="favs" style="display:none"></div>
  <details class="panel" open>
    <summary>studio config</summary>
    <div class="p-row"><span>palette</span><select id="cfg-palette"></select></div>
    <div class="p-row"><span>mouth</span><select id="cfg-mouth"></select></div>
    <div class="p-row"><span>background</span><input type="color" id="cfg-bg"></div>
    <div class="p-row p-io"><button id="btn-export">exportar</button><button id="btn-import">importar</button></div>
    <details class="sub" open>
      <summary>sensibilidade</summary>
      <div class="p-row p-check"><label><input type="checkbox" id="cfg-sens-local"> afinação só deste avatar</label></div>
      <div class="p-row"><span>fala</span><select id="cfg-fala"></select></div>
      <div class="p-row p-check"><label><input type="checkbox" id="cfg-fala-auto"> auto range (só na v3/v4)</label></div>
      <div id="sliders"></div>
    </details>
  </details>
</div>
<script src="engine.js"></script>
<script src="rig-page.js"></script>
<script type="module">
import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

/* os 11 sliders originais mantêm chave, range e valores gravados; os novos
   (viseme E, fecho, áudio, áudio nas vogais) têm omissão neutra — a 0/1 nada muda.
   O 5º campo é o grupo. */
const SLIDERS = [
  ['mouthGain', 'mouth gain', 0.4, 2, 'boca'],
  ['mouthWidth', 'mouth width', 0, 2, 'boca'],
  ['openHeight', 'open height', 0.4, 1.6, 'boca'],
  ['puckerFx', 'pucker fx', 0, 1.5, 'boca'],
  ['visemeE', 'viseme E (fendas no eee)', 0, 1.5, 'boca'],
  ['closeSpeed', 'fecho (entre sílabas)', 0.5, 2, 'boca'],
  ['smooth', 'reactivity', 0.3, 2, 'boca'],
  ['audioMix', 'áudio (mistura mic)', 0, 1, 'boca'],
  ['audioVisemes', 'áudio nas vogais (forma)', 0, 1, 'boca'],
  ['gazeGain', 'gaze gain', 0.3, 2, 'cabeça e olhos'],
  ['blinkGain', 'blink gain', 0.5, 2.5, 'cabeça e olhos'],
  ['headGain', 'head gain', 0, 2, 'cabeça e olhos'],
  ['headMove', 'head move', 0, 2.5, 'cabeça e olhos'],
  ['sphere', 'bola (boca/nariz)', 0, 2, 'cabeça e olhos'],
  ['lean', 'lean (olhos)', 0, 2, 'cabeça e olhos']
];

const painel = document.querySelector('.panel');
const emGaveta = () => window.matchMedia &&
  matchMedia('(max-width:700px), (pointer:coarse) and (max-width:1024px)').matches;
if (emGaveta()) painel.removeAttribute('open');
/* o painel expande para baixo, em fluxo; ao abrir, rolar até ele para o pôr em cena */
painel.addEventListener('toggle', () => {
  if (painel.open && emGaveta()) setTimeout(() =>
    painel.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
});

const palSel = document.getElementById('cfg-palette');
const mouthSel = document.getElementById('cfg-mouth');
const bgInput = document.getElementById('cfg-bg');
const localChk = document.getElementById('cfg-sens-local');
const falaSel = document.getElementById('cfg-fala');
const falaAutoChk = document.getElementById('cfg-fala-auto');

/* As quatro cadeias da boca, para A/B ao vivo. Nenhuma chave gravada muda de significado
   — o select escreve o {speechV2, speechV3} de sempre mais o `speechV4` novo, e uma
   configuração antiga com speechV2:1 reaparece aqui como v2 sem conversão nenhuma.
     v1  a cadeia validada na cara dele; é o que continua por omissão
     v2  liberta o teto do press (ver o comentário no engine)
     v3  cadeia nova: mouthClose com a semântica do ARKit, oclusão M/B/P própria e
         filtros em ms — afinada em vídeo real (tools/), por confirmar ao vivo
     v4  a v3 com os filtros exactos: o EMA da v3 tem um piso que satura os taus longos
         e faz a baseline do sorriso valer 827 ms a 60 fps e 2000 ms a 20 — a v4 tira-o.
         Grava speechV3 TAMBÉM a 1 (é a mesma cadeia): a v3 é que decide o caminho, e
         quem só lê o speechV3 — o debug do rig-page — continua a dizer a verdade. */
const FALA = [['v1', 0, 0, 0], ['v2', 1, 0, 0], ['v3 (experimental)', 0, 1, 0],
              ['v4 (experimental)', 0, 1, 1]];
FALA.forEach(([nome], i) => falaSel.add(new Option(nome, i)));

/* grava como qualquer sensibilidade, global ou só deste avatar */
function gravaSens(o) {
  Object.assign(page.SENS, o);
  if (localChk.checked) {
    const c = loadCritterCfg(page.id);
    c.sens = Object.assign({}, c.sens, o);
    saveCritterCfg(page.id, c);
  } else {
    saveGlobalSens(Object.assign(loadGlobalSens(), o));
  }
}

falaSel.addEventListener('change', () => {
  const [, v2, v3, v4] = FALA[+falaSel.value];
  gravaSens({ speechV2: v2, speechV3: v3, speechV4: v4 });
  falaAutoChk.disabled = !v3;
});

/* auto range: normaliza pelo curso que esta cara usa de facto. Na bancada piora os
   números (actores que já usam a boca toda não têm nada a ganhar) — está aqui porque
   o caso que interessa é o oposto, fala baixa, e esse só se vê ao vivo. */
falaAutoChk.addEventListener('change', () => gravaSens({ speechAuto: falaAutoChk.checked ? 1 : 0 }));

PALETTES.forEach((p, i) => palSel.add(new Option(p.name, i)));
MOUTH_STYLES.forEach((m, i) => mouthSel.add(new Option(m, i)));

const slidersEl = document.getElementById('sliders');
let grupoAtual = '';
for (const [key, label, mn, mx, grupo] of SLIDERS) {
  if (grupo && grupo !== grupoAtual) {
    grupoAtual = grupo;
    const h = document.createElement('div');
    h.className = 's-h';
    h.textContent = grupo;
    slidersEl.appendChild(h);
  }
  const row = document.createElement('div');
  row.className = 'p-row';
  row.innerHTML = '<span>' + label + ' <b id="v-' + key + '"></b></span>' +
                  '<input type="range" id="s-' + key + '" min="' + mn + '" max="' + mx + '" step="0.05">';
  slidersEl.appendChild(row);
  row.querySelector('input').addEventListener('input', e => {
    const v = +e.target.value;
    document.getElementById('v-' + key).textContent = v.toFixed(2);
    page.SENS[key] = v;
    if (localChk.checked) {
      const c = loadCritterCfg(page.id);
      c.sens = Object.assign({}, c.sens, { [key]: v });
      saveCritterCfg(page.id, c);
    } else {
      saveGlobalSens(Object.assign(loadGlobalSens(), { [key]: v }));
    }
  });
}

/* O microfone é pedido AQUI e só aqui: quando um dos dois controlos de áudio sai do
   zero. Nunca no arranque da página — e este handler é um gesto do utilizador, que é
   o que o browser exige para abrir um AudioContext. A voltar os dois a zero, larga-se
   o microfone (o indicador de gravação do browser apaga-se, que é o que se espera de
   controlos a zero). O `ajustaAudio` é que sabe qual dos dois casos é. */
for (const k of ['audioMix', 'audioVisemes']) {
  document.getElementById('s-' + k).addEventListener('input', () => page.ajustaAudio());
}

/* corre a cada loadCritter (inclusive o primeiro, de dentro de startRigPage) */
function syncPanel(p) {
  const cfg = loadCritterCfg(p.id);
  const t = parseId(p.id);
  palSel.value = cfg.traits && cfg.traits.palette !== undefined ? cfg.traits.palette : t.palette;
  mouthSel.value = cfg.traits && cfg.traits.mouth !== undefined ? cfg.traits.mouth : t.mouth;
  bgInput.value = p.pal.bg;
  localChk.checked = !!p.sensLocal;
  /* hierarquia v4 > v3 > v2 > v1 se mais do que uma aparecer gravada (não deve
     acontecer — a v4 grava as duas de propósito — mas uma config à mão pode tê-lo) */
  falaSel.value = p.SENS.speechV4 > 0 ? 3 : p.SENS.speechV3 > 0 ? 2 : p.SENS.speechV2 > 0 ? 1 : 0;
  falaAutoChk.checked = !!p.SENS.speechAuto;
  falaAutoChk.disabled = !(p.SENS.speechV3 > 0 || p.SENS.speechV4 > 0);
  for (const [key] of SLIDERS) {
    document.getElementById('s-' + key).value = p.SENS[key];
    document.getElementById('v-' + key).textContent = p.SENS[key].toFixed(2);
  }
}

const page = startRigPage({ FaceLandmarker, FilesetResolver, label: 'studio', onLoad: syncPanel });

function setTrait(name, value) {
  const c = loadCritterCfg(page.id);
  c.traits = Object.assign({}, c.traits, { [name]: value });
  saveCritterCfg(page.id, c);
  page.loadCritter(page.id);
}
palSel.addEventListener('change', () => setTrait('palette', +palSel.value));
mouthSel.addEventListener('change', () => setTrait('mouth', +mouthSel.value));
bgInput.addEventListener('input', e => {
  const c = loadCritterCfg(page.id);
  c.bg = e.target.value;
  saveCritterCfg(page.id, c);
  page.pal.bg = c.bg;
  document.body.style.background = c.bg;
});

/* trocar o âmbito: passar a global apaga o override deste avatar e recarrega */
localChk.addEventListener('change', () => {
  const c = loadCritterCfg(page.id);
  if (localChk.checked) {
    /* o máximo pessoal fica DE FORA da cópia: é a medição desta cara nesta câmara, e o
       cfg do avatar viaja no exportar e na sincronização — no telemóvel a lente é outra
       e o número certo lá é outro (ver `resolveSens` no engine, que o reescreve sempre
       na leitura; isto é para ele nem chegar a ser gravado) */
    const s = Object.assign({}, page.SENS);
    delete s.maxJaw;
    delete s.maxLip;
    c.sens = s;
  } else delete c.sens;
  saveCritterCfg(page.id, c);
  page.loadCritter(page.id);
});

document.getElementById('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(exportAll(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'critters-backup.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});

document.getElementById('btn-import').addEventListener('click', () => {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.addEventListener('change', () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const n = importAll(JSON.parse(r.result));
        page.loadCritter(page.id);
        syncPush();
        page.setStatus('importado: ' + n + ' critters + favoritos + afinação');
      } catch (e) { page.setStatus('importação falhou: ' + e.message); }
    };
    r.readAsText(file);
  });
  inp.click();
});

document.getElementById('btn-rigged').addEventListener('click', () => { window.location.href = 'rigged.html' + window.location.hash; });
document.getElementById('btn-reset').addEventListener('click', () => {
  try { localStorage.removeItem('critter-cfg:' + page.id); } catch (e) {}
  page.loadCritter(page.id);
});
</script>
</body>
</html>
